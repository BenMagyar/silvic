<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title description">
  <title id="title">Separate floating sums beside a packed integer histogram update</title>
  <desc id="description">LightGBM's default CPU histogram keeps separate floating-point gradient and Hessian sums, shown as independent strips. Silvic quantizes and packs the pair before one integer addition updates a feature bin. LightGBM also offers optional quantization.</desc>
  <style>
    :root { color-scheme: light dark; --ink: #203b2b; --muted: #46644e; --line: #719077; --green: #267344; --deep: #174f32; --soft: #a5c9a9; --wash: #e3f0e2; --paper: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #edf5eb; --muted: #c3d8c3; --line: #89ac8f; --green: #8cd19a; --deep: #c0eabf; --soft: #638e6b; --wash: #253b2b; --paper: #17231b; } }
    text { font: 600 15px system-ui, sans-serif; fill: var(--ink); }
    .caption { fill: var(--muted); }
    .accent { fill: var(--deep); }
    .outline { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
    .rule { stroke: var(--line); stroke-width: 1.4; }
  </style>
  <text x="18" y="31" class="caption">separate float sums</text>
  <text x="197" y="31" class="caption">quantize + pack</text>
  <path class="rule" d="M180 22V275" opacity=".42"/>
  <rect class="outline" x="24" y="64" width="52" height="174" rx="7"/>
  <rect class="outline" x="98" y="64" width="52" height="174" rx="7"/>
  <rect x="27" y="120" width="46" height="115" rx="3" fill="var(--green)"/>
  <rect x="101" y="95" width="46" height="140" rx="3" fill="var(--soft)"/>
  <path d="M27 150H73 M27 183H73 M27 210H73 M101 130H147 M101 166H147 M101 202H147" stroke="var(--paper)" stroke-width="3" opacity=".65"/>
  <rect x="209" y="70" width="116" height="20" rx="10" fill="var(--green)" opacity=".85"/>
  <rect x="209" y="99" width="116" height="20" rx="10" fill="var(--soft)"/>
  <g fill="var(--green)">
    <rect x="211" y="137" width="22" height="20" rx="3"/><rect x="239" y="137" width="22" height="20" rx="3"/><rect x="267" y="137" width="22" height="20" rx="3"/><rect x="295" y="137" width="22" height="20" rx="3"/>
  </g>
  <g fill="var(--soft)">
    <rect x="211" y="163" width="22" height="20" rx="3"/><rect x="239" y="163" width="22" height="20" rx="3"/><rect x="267" y="163" width="22" height="20" rx="3"/><rect x="295" y="163" width="22" height="20" rx="3"/>
  </g>
  <rect x="205" y="192" width="124" height="26" rx="5" fill="var(--wash)" stroke="var(--green)" stroke-width="1.5"/>
  <path d="M211 205H323" stroke="var(--green)" stroke-width="8"/>
  <path d="M211 211H323" stroke="var(--soft)" stroke-width="5"/>
  <rect class="outline" x="205" y="233" width="124" height="34" rx="6"/>
  <rect x="210" y="238" width="114" height="24" rx="3" fill="var(--wash)"/>
  <path d="M221 250H313" stroke="var(--green)" stroke-width="8" stroke-linecap="round"/>
  <text x="204" y="290" class="accent">one integer add</text>
</svg>
