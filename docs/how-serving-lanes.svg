<svg xmlns="http://www.w3.org/2000/svg" width="360" height="327" viewBox="0 0 330 300" role="img" aria-labelledby="title description">
  <title id="title">SIMD selects leaves across row lanes, then reads their values separately</title>
  <desc id="description">Aligned SIMD rows share a mask region. Hatching shows unreachable leaves in each row, while the first surviving leaf is highlighted at a different position. Dotted lines lead to separate value reads for each row.</desc>
  <style>
    :root { color-scheme: light dark; --ink: #213a28; --line: #668775; --tile: #f3f8f1; --soft: #d7ead9; --selected: #205c36; --selected-ink: #fff; --hatch: #456f50; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e6f2e4; --line: #8aaa91; --tile: #25372b; --soft: #38573e; --selected: #a9ddb0; --selected-ink: #17271b; --hatch: #b5d5b9; } }
    text { fill: var(--ink); font: 600 13px system-ui, sans-serif; }
    .value-label { font-size: 11px; }
    .tile { fill: var(--tile); stroke: var(--line); stroke-width: 1.5; }
    .survivor { fill: var(--soft); stroke: var(--selected); stroke-width: 1.5; }
    .chosen { fill: var(--selected); }
    .register { fill: none; stroke: var(--selected); stroke-width: 1.5; }
    .divider { stroke: var(--line); stroke-width: 1; opacity: .55; }
    .lookup { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 3; stroke-linecap: round; }
    .mark { fill: none; stroke: var(--selected-ink); stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <pattern id="masked" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V9" stroke="var(--hatch)" stroke-width="2" opacity=".75"/>
    </pattern>
  </defs>
  <text x="23" y="29">SIMD selects leaves</text>
  <text class="value-label" x="261" y="29">Value reads</text>
  <rect class="register" x="22" y="50" width="211" height="218" rx="10"/>
  <path class="divider" d="M23 123h209M23 196h209M248 51v216"/>
  <g>
    <rect class="chosen" x="30" y="65" width="39" height="43" rx="6"/>
    <rect class="survivor" x="82" y="65" width="39" height="43" rx="6"/>
    <rect class="tile" x="134" y="65" width="39" height="43" rx="6" opacity=".4"/>
    <rect class="tile" x="186" y="65" width="39" height="43" rx="6" opacity=".4"/>
    <rect x="134" y="65" width="39" height="43" rx="6" fill="url(#masked)"/>
    <rect x="186" y="65" width="39" height="43" rx="6" fill="url(#masked)"/>
    <path class="mark" d="M39 87h21"/>
    <path class="lookup" d="M235 87h27"/>
    <rect class="chosen" x="269" y="65" width="39" height="43" rx="6"/>
    <path class="mark" d="M278 87h21"/>
  </g>
  <g>
    <rect class="tile" x="30" y="138" width="39" height="43" rx="6" opacity=".4"/>
    <rect class="tile" x="82" y="138" width="39" height="43" rx="6" opacity=".4"/>
    <rect class="chosen" x="134" y="138" width="39" height="43" rx="6"/>
    <rect class="survivor" x="186" y="138" width="39" height="43" rx="6"/>
    <rect x="30" y="138" width="39" height="43" rx="6" fill="url(#masked)"/>
    <rect x="82" y="138" width="39" height="43" rx="6" fill="url(#masked)"/>
    <path class="mark" d="M143 160h21"/>
    <path class="lookup" d="M235 160h27"/>
    <rect class="chosen" x="269" y="138" width="39" height="43" rx="6"/>
    <path class="mark" d="M278 156h21M278 164h21"/>
  </g>
  <g>
    <rect class="tile" x="30" y="211" width="39" height="43" rx="6" opacity=".4"/>
    <rect class="tile" x="82" y="211" width="39" height="43" rx="6" opacity=".4"/>
    <rect class="tile" x="134" y="211" width="39" height="43" rx="6" opacity=".4"/>
    <rect class="chosen" x="186" y="211" width="39" height="43" rx="6"/>
    <rect x="30" y="211" width="39" height="43" rx="6" fill="url(#masked)"/>
    <rect x="82" y="211" width="39" height="43" rx="6" fill="url(#masked)"/>
    <rect x="134" y="211" width="39" height="43" rx="6" fill="url(#masked)"/>
    <path class="mark" d="M195 233h21"/>
    <path class="lookup" d="M235 233h27"/>
    <rect class="chosen" x="269" y="211" width="39" height="43" rx="6"/>
    <path class="mark" d="M279 233h2M287 233h2M295 233h2"/>
  </g>
</svg>
