<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title description">
  <title id="title">Worker integer histograms combine before shared smaller-child subtraction</title>
  <desc id="description">Ray workers combine local integer histograms, shown as two groups of bars stacked together. Both silvic and LightGBM subtract a built child's histogram from the parent to obtain its sibling. The bars illustrate histogram structure.</desc>
  <style>
    :root { color-scheme: light dark; --ink: #203b2b; --muted: #46644e; --line: #719077; --green: #267344; --deep: #174f32; --soft: #a5c9a9; --wash: #e3f0e2; --paper: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #edf5eb; --muted: #c3d8c3; --line: #89ac8f; --green: #8cd19a; --deep: #c0eabf; --soft: #638e6b; --wash: #253b2b; --paper: #17231b; } }
    text { font: 600 15px system-ui, sans-serif; fill: var(--ink); }
    .caption { fill: var(--muted); }
    .accent { fill: var(--deep); }
    .baseline { stroke: var(--line); stroke-width: 1.5; }
  </style>
  <defs>
    <pattern id="child" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="var(--wash)"/><path d="M-2 7L5 0 M3 9L10 2" fill="none" stroke="var(--green)" stroke-width="1.3"/></pattern>
  </defs>
  <text x="24" y="27" class="caption">worker histograms</text>
  <g fill="var(--green)">
    <rect x="39" y="82" width="23" height="20"/><rect x="77" y="69" width="23" height="33"/><rect x="115" y="89" width="23" height="13"/>
  </g>
  <g fill="var(--soft)">
    <rect x="222" y="75" width="23" height="27"/><rect x="260" y="89" width="23" height="13"/><rect x="298" y="75" width="23" height="27"/>
  </g>
  <path class="baseline" d="M28 102H148 M211 102H331"/>
  <text x="24" y="140" class="accent">integer sum</text>
  <g fill="var(--green)">
    <rect x="115" y="162" width="24" height="20"/><rect x="168" y="149" width="24" height="33"/><rect x="221" y="169" width="24" height="13"/>
  </g>
  <g fill="var(--soft)">
    <rect x="115" y="135" width="24" height="27"/><rect x="168" y="136" width="24" height="13"/><rect x="221" y="142" width="24" height="27"/>
  </g>
  <path class="baseline" d="M97 182H263"/>
  <text x="24" y="222" class="caption">shared smaller-child subtraction</text>
  <g fill="var(--green)">
    <rect x="32" y="246" width="16" height="31"/><rect x="58" y="247" width="16" height="30"/><rect x="84" y="251" width="16" height="26"/>
    <rect x="266" y="246" width="16" height="31"/><rect x="292" y="247" width="16" height="30"/><rect x="318" y="251" width="16" height="26"/>
  </g>
  <g fill="url(#child)">
    <rect x="32" y="230" width="16" height="16"/><rect x="58" y="231" width="16" height="16"/><rect x="84" y="237" width="16" height="14"/>
    <rect x="149" y="261" width="16" height="16"/><rect x="175" y="261" width="16" height="16"/><rect x="201" y="263" width="16" height="14"/>
  </g>
  <path class="baseline" d="M23 277H109 M140 277H226 M257 277H343"/>
</svg>
