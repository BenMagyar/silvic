<body class="diagram-gallery-page">
  <main>
    <header class="masthead deeper">
      <a class="rooted" href="./"><canvas class="growth" width="32" height="32" aria-hidden="true"></canvas>silvic</a>
      <nav class="trail" aria-label="silvic">
        <a href="how.html">How</a>
        <a href="docs/">Docs</a>
        <a href="changelog.html">Changelog</a>
      </nav>
    </header>
    <nav class="how-topics" aria-label="Diagram groups">
      <a href="#training">Training</a>
      <a href="#serving">Serving</a>
    </nav>
    <h1>Diagram options</h1>
    <section class="diagram-gallery" aria-labelledby="training">
      <h2 id="training">Training</h2>
      <figure class="how-visual">
        <img src="how-training-visual.svg" alt="Two separate floating-point sums beside a packed integer bin update. Gradient and hessian values are quantized and packed before the addition." width="360" height="300">
        <figcaption><strong>Paired bin update.</strong> The quantized pair uses one packed addition, while LightGBM’s default accumulates each value separately.</figcaption>
      </figure>
      <figure class="how-visual">
        <img src="how-training-flow.svg" alt="LightGBM's default adds gradient and hessian values to separate histogram accumulators. silvic quantizes and packs the pair before a single integer addition to one bin." width="360" height="300">
        <figcaption><strong>Separate and packed sums.</strong> Two additions on the left contrast with one addition of the packed pair on the right.</figcaption>
      </figure>
      <figure class="how-visual">
        <img src="how-training-reduce.svg" alt="Integer histogram bars from workers combine; parent and built-child histograms show the sibling subtraction shared with LightGBM." width="360" height="300">
        <figcaption><strong>Histogram reuse.</strong> Integer sums combine across workers; both engines reuse parent histograms.</figcaption>
      </figure>
    </section>
    <section class="diagram-gallery" aria-labelledby="serving">
      <h2 id="serving">Serving</h2>
      <figure class="how-visual">
        <img src="how-serving-visual.svg" alt="A translucent mask covers candidate leaf tiles; unreachable leaves fade, the first surviving leaf is highlighted, and its value appears in a separate tile." width="360" height="300">
        <figcaption><strong>Leaf mask.</strong> The mask reveals the selected leaf and its value.</figcaption>
      </figure>
      <figure class="how-visual">
        <img src="how-serving-tree.svg" alt="A threshold mark and a tree show the input's path while a mask filters unreachable leaves; the selected leaf has a separate value tile." width="360" height="325">
        <figcaption><strong>Threshold and leaf.</strong> The mask covers leaves excluded by the input.</figcaption>
      </figure>
      <figure class="how-visual">
        <img src="how-serving-lanes.svg" alt="Aligned rows inside a shared SIMD mask region select different surviving leaves; separate tiles at the right hold the values read for each row." width="360" height="327">
        <figcaption><strong>Rows together.</strong> A shared SIMD mask region selects a leaf for each row, and the kernel reads their values separately.</figcaption>
      </figure>
    </section>
  </main>
  <script src="mark.js"></script>
