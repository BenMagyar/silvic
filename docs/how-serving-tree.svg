<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 325" role="img" aria-labelledby="title description">
  <title id="title">A threshold position narrows a tree to its matching leaf</title>
  <desc id="description">A dot between threshold marks represents a numerical feature's reusable position. Beneath it, a small tree ends in leaf tiles. A translucent mask covers the leaves; hatching rules out the others and the remaining leaf is highlighted. Its value appears separately below. Using threshold positions and mask intersections avoids repeated tree walks.</desc>
  <style>
    :root { color-scheme: light dark; --ink: #213a28; --muted: #47614d; --line: #668775; --tile: #f3f8f1; --selected: #205c36; --selected-ink: #fff; --hatch: #456f50; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e6f2e4; --muted: #b9d2bc; --line: #8aaa91; --tile: #25372b; --selected: #a9ddb0; --selected-ink: #17271b; --hatch: #b5d5b9; } }
    text { fill: var(--ink); font: 600 16px system-ui, sans-serif; }
    .branches { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
    .node, .tile { fill: var(--tile); stroke: var(--line); stroke-width: 1.5; }
    .chosen { fill: var(--selected); }
  </style>
  <defs>
    <pattern id="masked" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V9" stroke="var(--hatch)" stroke-width="2" opacity=".75"/>
    </pattern>
  </defs>
  <text x="20" y="27">Threshold position</text>
  <path class="branches" d="M32 67H328 M82 58v18 M148 58v18 M214 58v18 M280 58v18"/>
  <circle cx="246" cy="67" r="7" fill="var(--selected)" stroke="var(--tile)" stroke-width="2"/>
  <path class="branches" d="M180 104 100 144 M180 104 260 144 M100 144 53 206 M100 144 123 206 M260 144 237 206 M260 144 307 206"/>
  <path d="M180 104 260 144 237 206" fill="none" stroke="var(--selected)" stroke-width="3" stroke-linecap="round"/>
  <circle class="node" cx="180" cy="104" r="8"/>
  <circle class="node" cx="100" cy="144" r="8"/>
  <circle class="node" cx="260" cy="144" r="8"/>
  <text x="20" y="192">Leaf mask</text>
  <rect class="tile" x="29" y="210" width="48" height="42" rx="6" opacity=".4"/>
  <rect class="tile" x="99" y="210" width="48" height="42" rx="6" opacity=".4"/>
  <rect class="chosen" x="213" y="210" width="48" height="42" rx="6"/>
  <rect class="tile" x="283" y="210" width="48" height="42" rx="6" opacity=".4"/>
  <path d="M39 231h28 M109 231h28 M223 231h28 M293 231h28" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M223 231h28" fill="none" stroke="var(--selected-ink)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="29" y="210" width="48" height="42" rx="6" fill="url(#masked)"/>
  <rect x="99" y="210" width="48" height="42" rx="6" fill="url(#masked)"/>
  <rect x="283" y="210" width="48" height="42" rx="6" fill="url(#masked)"/>
  <rect x="21" y="203" width="318" height="56" rx="9" fill="none" stroke="var(--selected)" stroke-width="1.5" opacity=".85"/>
  <text x="20" y="302">Value</text>
  <rect class="chosen" x="213" y="273" width="48" height="42" rx="6"/>
  <path d="M224 294h26" fill="none" stroke="var(--selected-ink)" stroke-width="4" stroke-linecap="round"/>
</svg>
