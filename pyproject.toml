[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "silvic"
description = "LightGBM-compatible gradient boosting on CPU, Metal, CUDA and AWS Neuron, single-node or distributed on Ray"
authors = [{ name = "Ben Magyar", email = "me@benmagyar.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["lightgbm", "gbdt", "lambdarank", "ray", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["numpy"]
dynamic = ["version"]

[project.optional-dependencies]
# silvic.ray reads `ray.data` datasets (Ray's `data` extra) and hashes and sorts them with pandas and pyarrow.
ray = ["ray[data,default]>=2.40", "pyarrow", "pandas"]
pandas = ["pandas"]
sklearn = ["scikit-learn"]
lightgbm = ["lightgbm"]
test = ["pytest", "pandas", "pyarrow", "scikit-learn", "lightgbm", "ray[data,default]>=2.40"]

[tool.maturin]
python-source = "python"
module-name = "silvic._silvic"
manifest-path = "crates/silvic-python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
