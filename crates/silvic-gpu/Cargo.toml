[package]
name = "silvic-gpu"
description = "Metal and CUDA backends for silvic: one kernel source, compiled at run time for either device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["lightgbm", "gbdt", "metal", "cuda", "gpu"]

[features]
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
cuda = ["dep:cudarc"]

[dependencies]
silvic-core = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
cudarc = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[lib]
# `cargo bench` arguments are criterion's: the lib's libtest bench harness, with no benches, would reject them.
bench = false

[[bench]]
name = "histogram"
harness = false
required-features = ["metal"]

[lints]
workspace = true
