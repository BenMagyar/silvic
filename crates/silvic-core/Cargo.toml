[package]
name = "silvic-core"
description = "LightGBM-compatible gradient boosting: binning, leaf-wise trees on integer histograms, model.txt I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lightgbm", "gbdt", "gradient-boosting", "lambdarank"]

[dependencies]
thiserror = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
# In-process multi-rank collectives (`test_util`) for this crate's and dependents' tests.
test-util = []

[dev-dependencies]
criterion = { workspace = true }

[lib]
# `cargo bench` arguments are criterion's: the lib's libtest bench harness, with no benches, would reject them.
bench = false

[lints]
workspace = true
