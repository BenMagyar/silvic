[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

[workspace.lints.clippy]
cognitive_complexity = "warn"
many_single_char_names = "warn"

# Benchmarks and wheels build with this profile; one codegen unit keeps their numbers independent of how rustc
# partitions a crate.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
silvic-core = { path = "crates/silvic-core" }
silvic-gpu = { path = "crates/silvic-gpu" }
silvic-net = { path = "crates/silvic-net" }
silvic-neuron = { path = "crates/silvic-neuron" }
silvic-serve = { path = "crates/silvic-serve" }
thiserror = "2"
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
libc = "0.2"
# Metal bindings; only the classes and protocols the device layer calls.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSArray"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLBuffer", "MTLResource", "MTLLibrary", "MTLCommandQueue", "MTLCommandBuffer", "MTLComputeCommandEncoder", "MTLCommandEncoder", "MTLComputePipeline", "MTLTypes", "MTLAllocation"] }
# The CUDA driver and NVRTC are loaded at run time: the crate builds on machines without the CUDA toolkit.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
criterion = "0.8"
